<body id="page">

<h1 id="title">
My Interactive Portfolio
</h1>

<hr>

<h2>Enter Your Name</h2>

<input type="text" id="name">

<button onclick="showName()">
Submit
</button>

<p id="result"></p>

<hr>

<h2>Change Heading Color</h2>

<button onclick="redColor()">
Red
</button>

<button onclick="blueColor()">
Blue
</button>

<button onclick="greenColor()">
Green
</button>

<hr>

<h2>Change Background Color</h2>

<button onclick="yellowBackground()">
Yellow
</button>

<button onclick="lightBlueBackground()">
Light Blue
</button>

<hr>

<h2>Secret Message</h2>

<p id="secret" style="display:none;">
🎉 Congratulations! You completed JavaScript.
</p>

<button onclick="showMessage()">
Show Message
</button>

<button onclick="hideMessage()">
Hide Message
</button>

<script>

function showName()
{
    var student =
    document.getElementById("name").value;

    document.getElementById("result").innerHTML =
    "Welcome " + student;
}

function redColor()
{
    document.getElementById("title").style.color =
    "red";
}

function blueColor()
{
    document.getElementById("title").style.color =
    "blue";
}

function greenColor()
{
    document.getElementById("title").style.color =
    "green";
}

function yellowBackground()
{
    document.getElementById("page").style.backgroundColor =
    "yellow";
}

function lightBlueBackground()
{
    document.getElementById("page").style.backgroundColor =
    "lightblue";
}

function showMessage()
{
    document.getElementById("secret").style.display =
    "block";
}

function hideMessage()
{
    document.getElementById("secret").style.display =
    "none";
}

</script>
